<div class="login">
  <div class="hero">
    <app-fuel-flow-scene />
  </div>

  <main class="panel">
    <div class="panel-inner">
      <div class="emblems">
        <img
          src="logos/ap-government.webp"
          alt="Emblem of the Government of Andhra Pradesh"
          width="88"
          height="96"
        />
        <img
          src="logos/ap-police.webp"
          alt="Emblem of Andhra Pradesh Police"
          width="92"
          height="96"
        />
      </div>
      <h1>AP Police MTO</h1>
      <p class="subtitle muted">Vehicles and fuel for Andhra Pradesh Police</p>

      <form class="card form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="login-username">Emp ID or login ID</label>
          <input
            id="login-username"
            type="text"
            formControlName="username"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
          />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">Log in</button>
      </form>
    </div>
  </main>
</div>

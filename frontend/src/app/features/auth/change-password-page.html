<div class="page">
  <app-page-header title="Change password" />

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    @if (compulsory()) {
      <p class="notice">You need to set a new password before you continue.</p>
    }
    <div class="field">
      <label for="cp-current">Current password</label>
      <input
        id="cp-current"
        type="password"
        formControlName="current"
        autocomplete="current-password"
      />
    </div>
    <div class="field">
      <label for="cp-new">New password</label>
      <input id="cp-new" type="password" formControlName="next" autocomplete="new-password" />
      <p class="muted hint">
        At least 8 characters. Avoid common passwords and all-number passwords.
      </p>
    </div>
    <div class="field">
      <label for="cp-confirm">Confirm new password</label>
      <input
        id="cp-confirm"
        type="password"
        formControlName="confirm"
        autocomplete="new-password"
      />
    </div>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button type="submit" class="btn btn-primary" [disabled]="busy()">Change password</button>
  </form>
</div>
